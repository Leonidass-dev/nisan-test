<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>QR Davetiye — Burcu & Oğulcan </title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/qr.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400;1,600&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,600&family=Inter:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>

<div class="bg-particles no-print" aria-hidden="true">
  <div class="particle p1"></div><div class="particle p2"></div>
</div>

<!-- ── Ayarlar Paneli (Yazdırılmaz) ──────── -->
<div class="settings-panel no-print">
  <div class="settings-inner glass-card">
    <h1 class="settings-title">
      <span class="text-gold">QR</span> Davetiye Oluştur
    </h1>

    <div class="settings-row">
      <div class="form-group">
        <label for="base-url">Site URL</label>
        <input type="url" id="base-url" placeholder="https://burcu-ogulcan.netlify.app">
      </div>
      <div class="form-group">
        <label for="masa-count">Masa Sayısı</label>
        <input type="number" id="masa-count" value="35" min="1" max="200">
      </div>
      <div class="form-group">
        <label for="masa-start">Başlangıç No</label>
        <input type="number" id="masa-start" value="1" min="1">
      </div>
    </div>

    <div class="settings-row">
      <div class="form-group">
        <label for="event-line">Alt Yazı (İsteğe Bağlı)</label>
        <input type="text" id="event-line" placeholder="Nişan · 2026" value="Nişan · 2026">
      </div>
      <div class="form-group">
        <label for="invite-text">Davet Metni</label>
        <input type="text" id="invite-text" value="Anınızı fotoğraflayın, bize hediye edin">
      </div>
    </div>

    <div class="settings-actions">
      <button class="btn btn-primary btn-lg" onclick="generateCards()">
        ✨ Kartları Oluştur
      </button>
      <button class="btn btn-gold btn-lg hidden" id="btn-print" onclick="window.print()">
        🖨️ Hepsini Yazdır / PDF
      </button>
    </div>
  </div>
</div>

<!-- ── QR Kartlar (Yazdırılabilir) ──────── -->
<div id="cards-container"></div>

<div id="toast-container"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/qr-generator.js"></script>
</body>
</html>
